name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.2.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Check peers
        run: pnpm peers check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test packages
        run: pnpm test

      - name: Test release tooling
        run: pnpm test:release

      - name: Typecheck packages
        run: pnpm exec turbo run typecheck --force

      - name: Build packages
        run: pnpm exec turbo run build --force

      - name: Check package tarballs
        run: pnpm pack:check

      - name: Test browser E2E
        run: pnpm test:e2e

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
